name: ghostchat_qudslab
description: "GhostChat - chat temporanea con tunnel Cloudflare embedded"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  shelf: ^1.4.1
